[tool.poetry]
name = "openvas-mcp"
version = "2025.03.0"
description = "MCP server and CLI for Greenbone Vulnerability Management (GVM/OpenVAS)"
authors = ["OpenVAS MCP Team"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/clawosiris/openvas-mcp-server"
keywords = ["openvas", "gvm", "greenbone", "mcp", "vulnerability", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
python-gvm = "^24.0"
mcp = { version = "^1.0", extras = ["cli"] }
pydantic = "^2.0"
typer = "^0.12"
rich = "^13.0"
tomli = { version = "^2.0", python = "<3.11" }
tomli-w = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^7.0"
pytest-mock = "^3.0"
pytest-asyncio = "^1.3"
ruff = "^0.4"
mypy = "^1.0"
pre-commit = "^3.0"

[tool.poetry.scripts]
openvas = "src.presentation.cli.main:app"
openvas-mcp = "src.presentation.mcp.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-safe-fixes = ["SIM105", "SIM102"]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "F841"]

# Mypy configuration
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disable_error_code = ["arg-type", "no-untyped-def"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
