name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Generate Version
    uses: ./.github/workflows/version.yml
    with:
      component: ""
    permissions:
      contents: write

  cli:
    name: Release CLI
    needs: [version]
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
      packages: write

  mcp:
    name: Release MCP
    needs: [version]
    uses: ./.github/workflows/release-mcp.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
      packages: write

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, cli, mcp]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Release ${{ needs.version.outputs.version }}"
          body: |
            ## Installation

            ### MCP Server
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ```

            ### CLI
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/openvas-cli:${{ needs.version.outputs.version }}
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
